name: Build CMA Orbit APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'release (signed, no debug flags) or debug'
        default: 'release'
        type: choice
        options: [release, debug]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sign with the permanent key and bump the version (so installs are updates)
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: python3 scripts/patch_android_signing.py

      - name: Apply app icon and splash screen
        run: |
          find android/app/src/main/res -name 'splash.png' -delete
          cp -r icons/res/. android/app/src/main/res/

      - name: Apply Android launch theme (no black flash)
        run: python3 scripts/patch_android_theme.py

      - name: Apply full-screen (edge-to-edge) and notch colour blending
        run: python3 scripts/patch_android_fullscreen.py

      - name: Sync web files
        run: npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Use a Maven Central mirror (Maven Central answers 429 Too Many Requests on busy runners)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/mirror.gradle <<'EOF'
          def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
          // runs before every build script, so the mirror is tried before mavenCentral()
          allprojects {
            buildscript { repositories { maven { url mirror } } }
            repositories { maven { url mirror } }
          }
          settingsEvaluated { settings ->
            settings.pluginManagement.repositories { maven { url mirror } }
          }
          EOF
          sed -i 's/^          //' ~/.gradle/init.d/mirror.gradle
          echo 'org.gradle.internal.http.connectionTimeout=120000' >> ~/.gradle/gradle.properties
          echo 'org.gradle.internal.http.socketTimeout=120000' >> ~/.gradle/gradle.properties
          cat ~/.gradle/init.d/mirror.gradle

      - name: Build APK (retries if a download fails)
        working-directory: android
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          chmod +x gradlew
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          TASK=assembleRelease; [ "$BUILD_TYPE" = "debug" ] && TASK=assembleDebug
          for i in 1 2 3 4 5; do
            ./gradlew $TASK && exit 0
            echo "Attempt $i failed, retrying in 60s..."; sleep 60
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CMA-Orbit-APK-${{ github.event.inputs.build_type || 'release' }}
          path: android/app/build/outputs/apk/**/*.apk
